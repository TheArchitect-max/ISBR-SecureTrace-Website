<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">ISBR SecureTrace conceptual evidence constellation</title>
  <desc id="desc">An abstract biological form illuminated in darkness, surrounded by provenance and evidence nodes. Conceptual representation only.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#9ff4d2" stop-opacity=".34"/>
      <stop offset=".34" stop-color="#3ccfa1" stop-opacity=".10"/>
      <stop offset="1" stop-color="#07100f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f2b66c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f2b66c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffe0" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#45cda1" stop-opacity=".48"/>
      <stop offset="1" stop-color="#f0b66c" stop-opacity=".42"/>
    </linearGradient>
    <filter id="blur32"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="900" height="980" rx="44" fill="#010201"/>
  <ellipse cx="478" cy="426" rx="340" ry="360" fill="url(#halo)" filter="url(#blur12)"/>
  <ellipse cx="240" cy="250" rx="180" ry="120" fill="url(#amber)" filter="url(#blur32)"/>

  <g opacity=".10" stroke="#baf8dd" fill="none">
    <path d="M108 208C262 90 480 96 674 200S890 540 744 738 376 930 148 772" stroke-width="1.5"/>
    <path d="M126 694C252 854 500 890 690 786S852 430 716 250" stroke-width="1"/>
  </g>

  <g transform="translate(450 470)">
    <ellipse rx="220" ry="244" fill="#020403" stroke="url(#ring)" stroke-width="2.5"/>
    <ellipse rx="170" ry="191" fill="none" stroke="#75e6bc" stroke-opacity=".22" stroke-width="1.5"/>
    <ellipse rx="112" ry="131" fill="#06100c" stroke="#8ef1c8" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M-100-22C-50-112 74-108 126-30S88 104 4 132-132 74-100-22Z" fill="#081711" stroke="#97f6cf" stroke-opacity=".42" stroke-width="2"/>
    <path d="M-64-17C-31-64 38-78 82-39S87 50 34 80-74 57-64-17Z" fill="#0d281e" opacity=".72"/>
    <circle cx="-10" cy="4" r="26" fill="#95f1cb" opacity=".18" filter="url(#soft)"/>
    <circle cx="-10" cy="4" r="7" fill="#d9ffed" opacity=".82"/>
  </g>

  <g fill="#a8f3d1">
    <circle cx="172" cy="332" r="5"/><circle cx="710" cy="286" r="5"/><circle cx="760" cy="548" r="5"/>
    <circle cx="224" cy="678" r="5"/><circle cx="592" cy="760" r="5"/>
  </g>
  <g stroke="#78dcb8" stroke-opacity=".22" fill="none" stroke-width="1.4">
    <path d="M172 332 304 402"/><path d="M710 286 593 376"/><path d="M760 548 650 535"/>
    <path d="M224 678 326 614"/><path d="M592 760 548 672"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="16" fill="#b6c8c1">
    <text x="90" y="304">PROVENANCE</text>
    <text x="708" y="258">EVIDENCE</text>
    <text x="754" y="588">TRACEABILITY</text>
    <text x="112" y="724">LIFECYCLE</text>
    <text x="574" y="806">ASSURANCE</text>
  </g>

  <g opacity=".88">
    <rect x="76" y="842" width="748" height="76" rx="20" fill="#020403" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="112" cy="880" r="6" fill="#9ff4d2"/>
    <text x="136" y="875" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e8f5f0">CONCEPTUAL REPRESENTATION</text>
    <text x="136" y="897" font-family="system-ui, sans-serif" font-size="12" fill="#7e948b">Abstract public visual — not a biological construct, device, or laboratory result.</text>
  </g>
</svg>